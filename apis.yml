aid: amazon-supply-chain
name: Amazon Supply Chain
description: AWS Supply Chain is a cloud-based application that works with your existing enterprise resource planning (ERP)
  and supply chain management systems to help you manage supply chain risks. It provides ML-powered insights and recommended
  actions to help mitigate supply chain disruptions.
